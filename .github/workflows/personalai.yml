name: PersonalAI

# Verifies the native iOS app and the platform-neutral core on hosted macOS, because development happens on Linux.
# Public repository => standard hosted runners are free. Private repository => macOS minutes are metered (see PersonalAI/docs/CI.md).
on:
  push:
    branches: [ "claude/personal-ai-iphone-po2z12", "main" ]
    paths: [ "PersonalAI/**", ".github/workflows/personalai.yml" ]
  pull_request:
    paths: [ "PersonalAI/**", ".github/workflows/personalai.yml" ]
  workflow_dispatch:
    inputs:
      sign:
        description: "Also produce a signed build (requires the signing secrets documented in PersonalAI/docs/DISTRIBUTION.md)"
        type: boolean
        default: false
      publish_release:
        description: "Attach the unsigned .ipa to a public pre-release named personalai-latest (easier download than an Actions artifact)"
        type: boolean
        default: false

concurrency:
  group: personalai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: PersonalAI } }
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift test --skip EndToEndTests/testNeuralPipelineMeetsRetrievalFloors

  macos-core:
    name: Core tests (macOS)
    runs-on: macos-26
    defaults: { run: { working-directory: PersonalAI } }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version; swift --version
      - run: swift test --skip EndToEndTests/testNeuralPipelineMeetsRetrievalFloors

  ios-sim:
    name: iOS app (Simulator build + unit tests)
    runs-on: macos-26
    needs: [ macos-core ]
    defaults: { run: { working-directory: PersonalAI/App } }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: PersonalAI/App/build/sim
          key: ios-sim-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-${{ github.run_id }}
          restore-keys: |
            ios-sim-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-
      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -skipMacroValidation -skipPackagePluginValidation -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/sim 2>&1 | tee build-sim.log | tail -5
      - name: Unit tests on Simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test-without-building -skipMacroValidation -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -destination "id=$DEST" -derivedDataPath build/sim \
            -resultBundlePath build/tests.xcresult 2>&1 | tee test-sim.log | tail -25
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: PersonalAI/App/build/sim
          key: ios-sim-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personalai-sim-logs
          path: |
            PersonalAI/App/*.log
            PersonalAI/App/build/tests.xcresult
          if-no-files-found: warn
      - name: Report
        if: always()
        run: |
          echo "=== REPORT (simulator) ==="
          grep -E "Executed [0-9]+ tests?, with|\*\* TEST (SUCCEEDED|FAILED)" test-sim.log 2>/dev/null | tail -3 || true
          grep -E "\*\* (TEST )?BUILD (SUCCEEDED|FAILED)" build-sim.log 2>/dev/null | tail -2 || true
          for f in build-sim.log test-sim.log; do [ -f $f ] && grep -E "error:|Test Case .* failed|XCTAssert" $f | sed 's#/Users/runner/work/about-us-builder/about-us-builder/PersonalAI/App/##' | cut -c1-260 | awk '!s[$0]++' | head -30; done; true

  ios-device:
    name: iOS app (unsigned Release build for a real iPhone, .ipa)
    runs-on: macos-26
    needs: [ macos-core ]
    permissions:
      contents: write
    defaults: { run: { working-directory: PersonalAI/App } }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: PersonalAI/App/build/device
          key: ios-device-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-${{ github.run_id }}
          restore-keys: |
            ios-device-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-
      - name: Unsigned device build
        run: |
          set -o pipefail
          xcodebuild build -skipMacroValidation -skipPackagePluginValidation -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build/device 2>&1 | tee build-device.log | tail -5
          APP=$(find build/device/Build/Products -maxdepth 2 -name "*.app" | head -1); echo "app: $APP"
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/ && (cd ipa && zip -qry ../PersonalAI-unsigned.ipa Payload)
          ls -la PersonalAI-unsigned.ipa
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: PersonalAI/App/build/device
          key: ios-device-${{ hashFiles('PersonalAI/App/project.yml', 'PersonalAI/Package.swift') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personalai-ios
          path: |
            PersonalAI/App/PersonalAI-unsigned.ipa
            PersonalAI/App/build-device.log
          if-no-files-found: warn
      - name: Publish pre-release (only when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view personalai-latest >/dev/null 2>&1 || gh release create personalai-latest --prerelease --title "Personal AI (latest CI build, unsigned)" --notes "Unsigned .ipa built by CI. Needs re-signing to install; see PersonalAI/docs/DISTRIBUTION.md. Not tested on a device." --target "$GITHUB_SHA"
          gh release upload personalai-latest PersonalAI-unsigned.ipa --clobber
      - name: Report
        if: always()
        run: |
          echo "=== REPORT (device) ==="
          grep -E "\*\* BUILD (SUCCEEDED|FAILED)" build-device.log 2>/dev/null | tail -2 || true
          [ -f PersonalAI-unsigned.ipa ] && { ls -l PersonalAI-unsigned.ipa; shasum -a 256 PersonalAI-unsigned.ipa; } || echo "no ipa"
          APPDIR=$(ls -d ipa/Payload/*.app 2>/dev/null | head -1)
          [ -n "$APPDIR" ] && { /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APPDIR/Info.plist"; /usr/bin/lipo -info "$APPDIR/PersonalAIApp"; echo "-- MLX shader bundle:"; find "$APPDIR/mlx-swift_Cmlx.bundle" -name "*.metallib" -exec ls -l {} \; ; } || true
          grep -E "error:" build-device.log 2>/dev/null | sed 's#/Users/runner/work/about-us-builder/about-us-builder/PersonalAI/App/##' | cut -c1-260 | awk '!s[$0]++' | head -30 || true

  testflight:
    name: Signed build → TestFlight (needs a paid Apple Developer account + secrets)
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    runs-on: macos-26
    needs: [ ios-sim, ios-device ]
    defaults: { run: { working-directory: PersonalAI/App } }
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do [ -n "${!v}" ] || { echo "::error::missing secret for $v - see PersonalAI/docs/DISTRIBUTION.md"; exit 1; }; done
      - name: Select newest Xcode
        run: X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X"
      - run: brew install xcodegen
      - name: Add the increased-memory-limit entitlement (paid accounts only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" Resources/PersonalAI.entitlements
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM_ID\"/" project.yml
          xcodegen generate
      - name: Archive and upload to TestFlight
        run: |
          set -eo pipefail
          mkdir -p ~/private_keys && echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          BUILD=$(date +%y%m%d%H%M)
          xcodebuild archive -skipMacroValidation -skipPackagePluginValidation -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PersonalAI.xcarchive CURRENT_PROJECT_VERSION=$BUILD $AUTH | tail -20
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PersonalAI.xcarchive -exportOptionsPlist build/export.plist -exportPath build/export $AUTH | tail -20
