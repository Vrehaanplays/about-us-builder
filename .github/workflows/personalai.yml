name: PersonalAI

# Verifies the native iOS app and the platform-neutral core on hosted macOS, because development happens on Linux.
# Public repository => standard hosted runners are free. Private repository => macOS minutes are metered (see PersonalAI/docs/CI.md).
on:
  push:
    branches: [ "claude/personal-ai-iphone-po2z12", "main" ]
    paths: [ "PersonalAI/**", ".github/workflows/personalai.yml" ]
  pull_request:
    paths: [ "PersonalAI/**", ".github/workflows/personalai.yml" ]
  workflow_dispatch:
    inputs:
      sign:
        description: "Also produce a signed build (requires the signing secrets documented in PersonalAI/docs/DISTRIBUTION.md)"
        type: boolean
        default: false

concurrency:
  group: personalai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: PersonalAI } }
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift test --skip EndToEndTests/testNeuralPipelineMeetsRetrievalFloors

  macos-core:
    name: Core tests (macOS)
    runs-on: macos-26
    defaults: { run: { working-directory: PersonalAI } }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version; swift --version
      - run: swift test --skip EndToEndTests/testNeuralPipelineMeetsRetrievalFloors

  ios-app:
    name: iOS app (build + unit tests on Simulator, unsigned device build)
    runs-on: macos-26
    needs: [ macos-core ]
    defaults: { run: { working-directory: PersonalAI/App } }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project PersonalAIApp.xcodeproj -scheme PersonalAIApp | tail -20
      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/sim 2>&1 | tee build-sim.log | tail -5
      - name: Unit tests on Simulator
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test-without-building -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -destination "id=$DEST" -derivedDataPath build/sim \
            -resultBundlePath build/tests.xcresult 2>&1 | tee test-sim.log | tail -25
      - name: Unsigned device build (.ipa for sideloading)
        run: |
          set -o pipefail
          xcodebuild build -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build/device 2>&1 | tee build-device.log | tail -5
          APP=$(find build/device/Build/Products -maxdepth 2 -name "*.app" | head -1); echo "app: $APP"
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/ && (cd ipa && zip -qry ../PersonalAI-unsigned.ipa Payload)
          ls -la PersonalAI-unsigned.ipa
      - name: Show errors
        if: failure()
        run: |
          for f in build-sim.log test-sim.log build-device.log; do [ -f $f ] && { echo "=== $f"; grep -nE "error:|error \(|Cycle|cycle|FAILED|failed" $f | head -60; }; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personalai-ios
          path: |
            PersonalAI/App/PersonalAI-unsigned.ipa
            PersonalAI/App/*.log
            PersonalAI/App/build/tests.xcresult
          if-no-files-found: warn

  testflight:
    name: Signed build → TestFlight (needs a paid Apple Developer account + secrets)
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    runs-on: macos-26
    needs: [ ios-app ]
    defaults: { run: { working-directory: PersonalAI/App } }
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do [ -n "${!v}" ] || { echo "::error::missing secret for $v - see PersonalAI/docs/DISTRIBUTION.md"; exit 1; }; done
      - name: Select newest Xcode
        run: X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X"
      - run: brew install xcodegen
      - name: Add the increased-memory-limit entitlement (paid accounts only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" Resources/PersonalAI.entitlements
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM_ID\"/" project.yml
          xcodegen generate
      - name: Archive and upload to TestFlight
        run: |
          set -eo pipefail
          mkdir -p ~/private_keys && echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          BUILD=$(date +%y%m%d%H%M)
          xcodebuild archive -project PersonalAIApp.xcodeproj -scheme PersonalAIApp -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PersonalAI.xcarchive CURRENT_PROJECT_VERSION=$BUILD $AUTH | tail -20
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PersonalAI.xcarchive -exportOptionsPlist build/export.plist -exportPath build/export $AUTH | tail -20
