name: PersonalAI
options:
  bundleIdPrefix: com.vrehaanplays
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PersonalAICore:
    path: ..
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 48114eedf3c3d4a682a6b1d644cc5af5c2945d10
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
targets:
  PersonalAI:
    type: application
    platform: iOS
    sources: [ Sources, Resources ]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Personal AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [ UIInterfaceOrientationPortrait ]
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Optional. Lets Personal AI index text and labels in the photos you choose, entirely on this device."
        UIFileSharingEnabled: false
        UIBackgroundModes: [ processing ]
        BGTaskSchedulerPermittedIdentifiers: [ com.vrehaanplays.personalai.indexing ]
        CFBundleDocumentTypes:
          - { CFBundleTypeName: "Conversation export", LSHandlerRank: Alternate, LSItemContentTypes: [ public.json, public.zip-archive, public.plain-text ] }
    entitlements:
      path: Resources/PersonalAI.entitlements
      properties: {}   # paid-team lane adds com.apple.developer.kernel.increased-memory-limit (see docs/DISTRIBUTION.md)
    dependencies:
      - package: PersonalAICore
        product: PersonalAICore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXEmbedders
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftHuggingFace
        product: HuggingFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrehaanplays.personalai
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PersonalAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [ Tests ]
    dependencies:
      - target: PersonalAI
schemes:
  PersonalAI:
    build: { targets: { PersonalAI: all, PersonalAITests: [ test ] } }
    test: { targets: [ PersonalAITests ] }
