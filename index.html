<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Submit your profile for our About Us page."><title>Join the Team</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="intro"><p class="eyebrow">TEAM DIRECTORY / SUBMIT</p><h1>Tell your<br><em>story.</em></h1><p class="lede">Submit your profile for review. Once accepted, it will appear on our About Us page.</p><div class="rule"></div><p class="note">Your bio is optional and only appears if you choose to share it.</p><a class="text-link" href="/about-us.html">View About Us →</a></section><section class="form-panel"><form id="profile-form"><div class="form-heading"><span>YOUR DETAILS</span><span>REVIEW REQUIRED</span></div><div class="fields"><label class="image-picker" for="photo"><input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required><span id="photo-placeholder"><b>+</b><span>Add photo</span></span><img id="photo-preview" alt="Selected profile photo" hidden></label><div class="image-copy"><strong>Image of yourself</strong><span>JPG, PNG, or WebP · 5 MB max</span></div><label>Full name<input name="name" type="text" placeholder="e.g. Maya Chen" required></label><label>Role<input name="role" type="text" placeholder="e.g. CTO" required></label><div class="two-up"><label>School<input name="school" type="text" placeholder="e.g. Westview High" required></label><label>Grade<input name="grade" type="text" placeholder="e.g. 11th" required></label></div><label>Small bio <span class="optional">optional</span><textarea name="bio" rows="3" maxlength="400" placeholder="A few words about who you are or what inspires you."></textarea></label><label class="toggle-row"><input name="showBio" type="checkbox" checked><span class="toggle"></span><span>Show bio on the About Us page</span></label></div><button id="submit-button" type="submit">Submit for review <span>↗</span></button><p id="form-message" class="form-message" aria-live="polite"></p></form></section></main><script src="script.js"></script></body></html>
